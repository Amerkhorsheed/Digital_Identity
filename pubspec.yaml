name: a_digital_id
description: "A professional digital identity registration system with photo capture, QR issuance and PNG/PDF export."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  share_plus: ^12.0.2
  sqflite: ^2.4.3
  mobile_scanner: ^7.4.0
  app_links: ^7.2.1
  # Real hardware biometrics (BiometricPrompt / Touch ID / Face ID).
  local_auth: ^3.0.2
  local_auth_android: ^2.0.9
  local_auth_darwin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.4.2
  local_auth_platform_interface: ^1.1.0

  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/A.jpg
    - assets/A_mark.png

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
