<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="إدارة القوى البشرية — الهوية الرقمية ورعاية المنتسب">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="الهوية الرقمية">
  <link rel="apple-touch-icon" href="assets/A.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/A.jpg"/>

  <title>إدارة القوى البشرية — الهوية الرقمية</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #17352F;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(185, 167, 121, 0.2);
      border-top-color: #B9A779;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .brand-title {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="spinner"></div>
    <div class="brand-title">إدارة القوى البشرية · الهوية الرقمية</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
